name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Code Quality (Linter)
        run: npm run lint

      - name: Check TypeScript Compilation
        run: npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Run E2E Mock Tests
        run: npm run test:e2e

      - name: Full Stack Integration Test (PostgreSQL + Migrations + Seed + Repeat Seed)
        run: |
          cp .env.example .env
          docker compose up -d --build
          sleep 5

          # 1. Первая глубокая проверка только что засеянной базы:
          node test/smoke-stack.cjs

          # 2. Проверяем сценарий повторного сида на существующей базе:
          docker compose run --rm db-init npx prisma db seed

          # 3. Повторная глубокая проверка (убеждаемся, что данные не сломались и не дублировались):
          node test/smoke-stack.cjs

          docker compose down