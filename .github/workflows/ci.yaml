name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Code Quality (Linter)
        run: npm run lint

      - name: Check TypeScript Compilation
        run: |
          npm run build
          npm run typecheck:seed

      - name: Run Unit Tests
        run: npm test

      - name: Run E2E Mock Tests
        run: node --test test/app.e2e.test.cjs

      - name: Full Stack Integration Test
        run: |
          cp .env.example .env
          docker compose up -d --build
          docker compose up -d --wait --wait-timeout 120 api
          node test/smoke-stack.cjs
          docker compose run --rm --no-deps db-init npm run test:db

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose down
