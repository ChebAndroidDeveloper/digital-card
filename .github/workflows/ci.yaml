name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript Compilation
        run: npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Run E2E Mock Tests
        run: npm run test:e2e

      - name: Integration Test with Real PostgreSQL (Docker Compose Stack)
        run: |
          cp .env.example .env
          docker compose up -d --build
          sleep 5
          curl --fail --retry 10 --retry-delay 2 -s -X POST http://localhost:3000/graphql \
            -H "Content-Type: application/json" \
            -d '{"query": "{ profile(locale: \"en\") { name title experience { company sortOrder } } }"}' | grep "Konstantin Chumbakov"
          docker compose down